        let currentCategory = 'all';

        // Render Cards
        function renderPlants(data) {
            const grid = document.getElementById('plantsGrid');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');
            
            grid.innerHTML = '';
            resultCount.textContent = data.length;

            if (data.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            data.forEach(plant => {
                const card = document.createElement('div');
                card.className = "plant-card bg-white rounded-2xl border border-gray-100 shadow-sm hover:border-herb-200 overflow-hidden flex flex-col justify-between cursor-pointer";
                card.onclick = () => openModal(plant.id);

                // Badges HTML
                const tagsHtml = plant.tags.map(t => `<span class="bg-herb-50 text-herb-700 text-[11px] font-medium px-2 py-0.5 rounded-md border border-herb-100/80">#${t}</span>`).join(' ');

                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold text-herb-600 bg-herb-50 px-2.5 py-1 rounded-lg border border-herb-200/50">
                                #${String(plant.id).padStart(2, '0')}
                            </span>
                            <span class="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-md">

                            </div>

        // Filter Function
        function filterPlants() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const clearBtn = document.getElementById('clearSearchBtn');
            
            if (query) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const filtered = plantsData.filter(plant => {
                const matchCategory = (currentCategory === 'all') || (plant.category === currentCategory);
                const matchQuery = !query || 
                    plant.name.toLowerCase().includes(query) ||
                    plant.alias.toLowerCase().includes(query) ||
                    plant.summary.toLowerCase().includes(query) ||
                    plant.tags.some(t => t.toLowerCase().includes(query));

                return matchCategory && matchQuery;
            });

            renderPlants(filtered);
        }

        // Set Active Category Filter
        function setCategory(cat) {
            currentCategory = cat;
            
            // Update active styles
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all whitespace-nowrap bg-herb-700 text-white shadow-sm";
                } else {
                    btn.className = "cat-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all whitespace-nowrap bg-white text-gray-600 hover:bg-herb-50 hover:text-herb-700 border border-gray-200";
                }
            });

            filterPlants();
        }

        // Clear Search
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterPlants();
        }

        // Reset All Filters
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            setCategory('all');
        }

        // Open Modal
        function openModal(id) {
            const plant = plantsData.find(p => p.id === id);
            if (!plant) return;

            document.getElementById('modalId').textContent = `#${String(plant.id).padStart(2, '0')}`;
            document.getElementById('modalNature').textContent = `藥性：${plant.nature}`;
            document.getElementById('modalTitle').textContent = plant.name;
            document.getElementById('modalAlias').textContent = `別名：${plant.alias}`;
            document.getElementById('modalEfficacy').textContent = plant.summary;
            document.getElementById('modalCaution').textContent = plant.caution || "草本食療因個人體質而異，建議根據自身狀況適量食用。";

            // Tags
            const tagsContainer = document.getElementById('modalTags');
            tagsContainer.innerHTML = plant.tags.map(t => 
                `<span class="bg-herb-100 text-herb-800 text-xs font-semibold px-2.5 py-1 rounded-lg border border-herb-200"># ${t}</span>`
            ).join('');

            // Background Icon
            document.getElementById('modalIconBg').innerHTML = `<i class="fa-solid ${plant.icon}"></i>`;

            // Dietary Methods
            const dietaryContainer = document.getElementById('modalDietary');
            dietaryContainer.innerHTML = plant.dietary.map(item => `
                <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                    <div class="font-bold text-herb-700 mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-dot text-[10px]"></i> ${item.type}
                    </div>
                    <p class="text-xs text-gray-600 leading-relaxed">${item.desc}</p>
                </div>
            `).join('');

            const modal = document.getElementById('detailModal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close Modal
        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Close Modal on backdrop click
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC Key to close modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initial Render
        window.onload = function() {
            renderPlants(plantsData);
        };
    </script>
</body>
</html>
